[project]
name = "livehost-api"
version = "0.1.0"
description = "TikTok Live AI co-host, as a gateway plugin"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
  "websockets",
  "TikTokLive>=6.6.0",
]

[project.optional-dependencies]
# ruff pinned to match the gateway repo's installed version exactly: identical
# code must lint identically in both repos while this move is being audited,
# and ruff's default rule set has grown between 0.15.20 and later releases,
# so an unpinned ruff here would flag byte-identical code the gateway doesn't.
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "ruff==0.15.20"]

[project.scripts]
livehost = "livehost.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 120

[tool.hatch.build.targets.wheel]
packages = ["src/livehost"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
